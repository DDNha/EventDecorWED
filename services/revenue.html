<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thống kê doanh thu</title>
  <!-- Nhúng Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    /* Tổng thể nền trang */
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Hiệu ứng card: chuyển động mượt khi hover và viền nhẹ */
    .bg-white {
      transition: all 0.3s ease-in-out;
      border: 1px solid rgba(0, 0, 0, 0.04);
    }

    .bg-white:hover {
      transform: translateY(-4px);
      box-shadow: 0 .5rem 1.5rem rgba(0,0,0,.08) !important;
    }

    /* Tùy chỉnh chữ chú thích nhỏ */
    .text-muted {
      font-size: 0.875rem;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* Khu vực hiển thị biểu đồ */
    .bg-light.rounded-3 {
      border: 2px dashed #dee2e6;
      background-color: #fafbfc !important;
      transition: border-color 0.2s ease;
    }

    .bg-light.rounded-3:hover {
      border-color: #adb5bd;
    }
  </style>
</head>
<body class="py-5">

<div class="container-fluid">
  <h3 class="fw-bold mb-4">Thống kê doanh thu</h3>

  <div class="row g-4 mb-4">
    <div class="col-md-4">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <small class="text-muted">Tổng doanh thu năm</small>
        <h3 class="fw-bold text-success mt-1">1.250.000.000đ</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <small class="text-muted">Doanh thu tháng này</small>
        <h3 class="fw-bold text-danger mt-1">125.000.000đ</h3>
      </div>
    </div>
    <div class="col-md-4">
      <div class="bg-white p-4 rounded-4 shadow-sm">
        <small class="text-muted">Đã thanh toán qua hệ thống</small>
        <h3 class="fw-bold text-primary mt-1">98.000.000đ</h3>
      </div>
    </div>
  </div>

  <div class="bg-white p-4 rounded-4 shadow-sm">
    <h5 class="fw-bold mb-3">Biểu đồ tăng trưởng doanh thu</h5>
    <div class="text-center py-5 bg-light rounded-3 text-muted">
      [ Khu vực hiển thị biểu đồ cột / đường (Chart.js) ]
    </div>
  </div>
</div>

</body>
</html>
