<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WedPro - Thêm dịch vụ mới</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS tùy chỉnh trực tiếp trong file HTML -->
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
            color: #333;
        }

        /* Căn giữa và giới hạn độ rộng cho form thêm dịch vụ */
        .add-service-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Tùy chỉnh input và select */
        .add-service-container .form-control,
        .add-service-container .form-select {
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            font-size: 14px;
        }

        .add-service-container .form-control:focus,
        .add-service-container .form-select:focus {
            border-color: #dc3545;
            box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.15);
        }

        .add-service-container .form-label {
            font-size: 13px;
            color: #495057;
            margin-bottom: 6px;
        }
    </style>
</head>

<body class="bg-light">

    <div class="container-fluid py-5">
        <!-- Khung chứa form được căn giữa màn hình -->
        <div class="add-service-container">
            <h3 class="fw-bold mb-4 text-center">Thêm dịch vụ mới</h3>

            <div class="bg-white p-4 p-md-5 rounded-4 shadow-sm">
                <form>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Tên dịch vụ</label>
                            <input type="text" class="form-control" placeholder="Nhập tên dịch vụ...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Danh mục</label>
                            <select class="form-select">
                                <option>Sinh nhật</option>
                                <option>Sự kiện</option>
                                <option>Thôi nôi</option>
                                <option>Tân gia</option>
                                <option>Tiệc kỷ niệm</option>
                                <option>Khai trương</option>
                                <option>Cho thuê sảnh tiệc</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Giá dịch vụ (VNĐ)</label>
                            <input type="number" class="form-control" placeholder="Nhập giá...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Hình ảnh dịch vụ</label>
                            <input type="file" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Mô tả chi tiết</label>
                            <textarea class="form-control" rows="4" placeholder="Nhập mô tả về dịch vụ..."></textarea>
                        </div>
                        <div class="col-12 text-end mt-4">
                            <button type="submit" class="btn btn-danger rounded-pill px-5 py-2 fw-bold">Lưu dịch vụ</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
