<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WedPro - Danh sách dịch vụ</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- CSS tùy chỉnh trực tiếp trong file -->
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f8f9fa;
      color: #333;
    }

    /* Tùy chỉnh bảng dữ liệu */
    .table th {
      font-weight: 600;
      color: #495057;
      background-color: #f8f9fa;
      border-bottom: 2px solid #dee2e6;
    }

    .table td {
      vertical-align: middle;
      color: #212529;
    }

    /* Bo tròn và hiệu ứng bóng cho khung bao bọc */
    .rounded-4 {
      border-radius: 1rem !important;
    }

    /* Tùy chỉnh các nút bấm hành động */
    .btn-outline-primary:hover {
      background-color: #0d6efd;
      color: #fff;
    }

    .btn-outline-danger:hover {
      background-color: #dc3545;
      color: #fff;
    }
  </style>
</head>

<body class="bg-light">

  <div class="container-fluid py-4">
    <!-- Tiêu đề và nút thêm mới -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Danh sách dịch vụ</h3>
      <a href="#" class="btn btn-danger rounded-pill px-4 fw-bold btn-add-service-trigger">
        <i class="fa-solid fa-plus me-2"></i>Thêm dịch vụ mới
      </a>
    </div>

    <!-- Khung chứa bảng danh sách -->
    <div class="bg-white p-4 rounded-4 shadow-sm">
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <thead class="table-light" style="font-size: 13px;">
            <tr>
              <th>Hình ảnh</th>
              <th>Tên dịch vụ</th>
              <th>Danh mục</th>
              <th>Giá (VNĐ)</th>
              <th>Trạng thái</th>
              <th class="text-end">Hành động</th>
            </tr>
          </thead>
          <tbody style="font-size: 14px;">
            <tr>
              <td>
                <img src="/img/birthday.png" alt="Dịch vụ" class="rounded-3 shadow-sm" width="50" height="50"
                  style="object-fit: cover;">
              </td>
              <td class="fw-bold">Gói trang trí sinh nhật cao cấp</td>
              <td>Trang trí sự kiện</td>
              <td class="fw-semibold text-danger">1.500.000đ</td>
              <td>
                <span class="badge bg-success-subtle text-success border border-success px-3 py-1 rounded-pill"
                  style="font-size: 12px;">Hoạt động</span>
              </td>
              <td class="text-end">
                <button class="btn btn-sm btn-outline-primary rounded-circle me-1" title="Chỉnh sửa"
                  style="width: 32px; height: 32px;">
                  <i class="fa-solid fa-pen"></i>
                </button>
                <button class="btn btn-sm btn-outline-danger rounded-circle" title="Xóa"
                  style="width: 32px; height: 32px;">
                  <i class="fa-solid fa-trash"></i>
                </button>
              </td>
            </tr>
            <!-- Bạn có thể copy thêm các dòng <tr> khác ở đây khi có nhiều dịch vụ hơn -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const btnAddService = document.querySelector(".btn-add-service-trigger");

    if (btnAddService) {
      btnAddService.addEventListener("click", function (e) {
        e.preventDefault();

        // Kiểm tra xem trang này có đang chạy trong iframe hay không
        if (window.parent && window.parent !== window) {
          // Gọi hàm hoặc kích hoạt click vào menu "Thêm dịch vụ" ở trang cha (sale.html)
          const parentMenuAdd = window.parent.document.querySelector('[data-target="iframe-add-service"]');
          if (parentMenuAdd) {
            parentMenuAdd.click(); // Tự động kích hoạt sự kiện chuyển tab như khi bấm menu
          }
        }
      });
    }
  });
</script>

</html>
