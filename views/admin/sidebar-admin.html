<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EventDecor - Admin</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Google Icon -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .icon-slot {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .active-indicator {
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 5px;
      background-color: #3b82f6;
      border-top-right-radius: 9999px;
      border-bottom-right-radius: 9999px;
    }
  </style>
</head>
<aside class="w-[270px] h-screen bg-[#0d1527] border-r border-[#17233d] flex flex-col flex-shrink-0 select-none shadow-2xl z-20">
  
  <!-- BRAND / LOGO HEADER -->
  <div class="px-5 pt-6 pb-6 flex items-center gap-3.5">
    <!-- Logo Box -->
    <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#06b6d4] to-[#2563eb] flex items-center justify-center shadow-lg shadow-cyan-500/15 shrink-0 ring-1 ring-white/10">
      <span class="icon-slot"></span>
    </div>
    <!-- Brand Name & Admin Badge -->
    <div class="flex flex-col">
      <span class="text-[17px] font-bold text-white tracking-wide leading-snug">
        EventDecor
      </span>
      <div class="mt-0.5">
        <span class="inline-flex items-center px-2 py-0.5 text-[10px] font-semibold tracking-wider text-[#14b8a6] bg-[#0f2d33] border border-[#115e59]/40 rounded">
          ADMIN
        </span>
      </div>
    </div>
  </div>

  <nav class="flex-1 overflow-y-auto custom-scroll px-3.5 space-y-5">
    
    <!-- TỔNG QUAN -->
    <div>
      <h3 class="px-3 text-[11px] font-semibold tracking-widest text-[#64748b] uppercase">
        TỔNG QUAN
      </h3>
      
      <div class="mt-2.5">
        <!-- Dashboard -->
        <a href="dashboard.html" id="nav-dashboard" class="nav-link relative flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group overflow-hidden">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="w-5 h-5 fill-current shrink-0">
            <path d="M280-280h80v-280h-80v280Zm160 0h80v-400h-80v400Zm160 0h80v-160h-80v160ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm0-80h560v-560H200v560Zm0-560v560-560Z"/>
          </svg>
          <span>Dashboard</span>
        </a>
      </div>
    </div>

    <!-- QUẢN LÝ -->
    <div>
      <h3 class="px-3 text-[11px] font-semibold tracking-widest text-[#64748b] uppercase">
        QUẢN LÝ
      </h3>
      
      <div class="mt-2 space-y-1">
        
        <!-- 1. Quản lý Tài khoản (Accordion) -->
        <div class="space-y-1">
          <button 
            type="button" 
            id="btn-account-toggle"
            class="relative w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group focus:outline-none overflow-hidden"
          >
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined text-[20px]">group</span>
              <span>Quản lý Tài khoản</span>
            </div>
            <span id="account-arrow" class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-transform duration-200 inline-block origin-center">
              chevron_right
            </span>
          </button>

          <div id="account-submenu" class="hidden pl-4 pr-1 py-1 space-y-1">
            <!-- Option 1: Khách hàng -->
            <a href="accounts-customers.html" class="nav-link relative flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#94a3b8] hover:text-[#60a5fa] hover:bg-[#15223c]/60 transition-colors overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-[#3b82f6]"></span>
              <span>Tài khoản Khách hàng</span>
            </a>

            <!-- Option 2: Đối tác -->
            <a href="accounts-partners.html" class="nav-link relative flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#94a3b8] hover:text-[#60a5fa] hover:bg-[#15223c]/60 transition-colors overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-[#3b82f6]"></span>
              <span>Tài khoản Đối tác</span>
            </a>

            <!-- Option 3: Admin -->
            <a href="accounts-admins.html" class="nav-link relative flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#94a3b8] hover:text-[#60a5fa] hover:bg-[#15223c]/60 transition-colors overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-[#3b82f6]"></span>
              <span>Tài khoản Admin</span>
            </a>
          </div>
        </div>

        <!-- 2. Quản lý Dịch vụ (Accordion) -->
        <div class="space-y-1">
          <button 
            type="button" 
            id="btn-service-toggle"
            class="relative w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group focus:outline-none overflow-hidden"
          >
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined text-[20px]">dashboard</span>
              <span>Quản lý Dịch vụ</span>
            </div>
            <span id="service-arrow" class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-transform duration-200 inline-block origin-center">
              chevron_right
            </span>
          </button>

          <div id="service-submenu" class="hidden pl-4 pr-1 py-1 space-y-1">
            <!-- Option 1: Duyệt dịch vụ -->
            <a href="approve-event.html" class="nav-link relative flex items-center gap-2.5 px-3 py-2 rounded-lg text-[13px] font-medium text-[#94a3b8] hover:text-[#60a5fa] hover:bg-[#15223c]/60 transition-colors overflow-hidden">
              <span class="w-1.5 h-1.5 rounded-full bg-[#3b82f6]"></span>
              <span>Duyệt dịch vụ</span>
            </a>
          </div>
        </div>

        <!-- 3. Quản lý Đơn hàng -->
        <a href="orders.html" class="nav-link relative flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group overflow-hidden">
          <div class="flex items-center gap-3.5">
            <span class="material-symbols-outlined text-[20px]">shopping_bag</span>
            <span>Quản lý Đơn hàng</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-colors select-none">
            chevron_right
          </span>
        </a>

        <!-- 4. Quản lý Nhận xét -->
        <a href="reviews.html" class="nav-link relative flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group overflow-hidden">
          <div class="flex items-center gap-3.5">
            <span class="material-symbols-outlined text-[20px]">comment</span>
            <span>Quản lý Nhận xét</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-colors select-none">
            chevron_right
          </span>
        </a>

        <!-- 5. Quản lý Thu nhập -->
        <a href="income.html" class="nav-link relative flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group overflow-hidden">
          <div class="flex items-center gap-3.5">
            <span class="icon-slot"></span>
            <span>Quản lý Thu nhập</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-colors select-none">
            chevron_right
          </span>
        </a>

        <!-- 6. Quản lý Lương -->
        <a href="salaries.html" class="nav-link relative flex items-center justify-between px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all group overflow-hidden">
          <div class="flex items-center gap-3.5">
            <span class="icon-slot"></span>
            <span>Quản lý Lương</span>
          </div>
          <span class="material-symbols-outlined text-[18px] text-[#475569] group-hover:text-[#94a3b8] transition-colors select-none">
            chevron_right
          </span>
        </a>

      </div>
    </div>

    <div class="pt-2 border-t border-[#17233d]"></div>

    <!-- CÀI ĐẶT -->
    <div>
      <a href="settings.html" class="nav-link relative flex items-center gap-3.5 px-3.5 py-2.5 rounded-xl text-[13.5px] font-medium text-[#94a3b8] hover:text-white hover:bg-[#15223c] transition-all overflow-hidden">
        <span class="material-symbols-outlined text-[20px]">settings</span>
        <span>Cài đặt</span>
      </a>
    </div>

  </nav>

  <!-- ĐĂNG XUẤT -->
  <div class="p-3.5 border-t border-[#17233d] bg-[#0b1222]/60">
    <a href="login.html" class="flex items-center gap-3.5 px-3.5 py-2.5 rounded-lg text-[13.5px] font-medium text-red-400 hover:text-red-300 transition-all duration-150 group">
      <span class="material-symbols-outlined text-[20px]">logout</span>
      <span class="font-medium tracking-wide">Đăng xuất</span>
    </a>
  </div>

</aside>
