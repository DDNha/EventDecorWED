<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Tiêu đề trang động (trang con có thể ghi đè) -->
  <title>{% block title %}EventDecor Admin{% endblock %}</title>

  <!-- 1. Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- 2. Google Fonts (Inter) & Material Symbols -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

  <!-- 3. CSS Tùy Chỉnh Toàn Cục Cho Admin -->
  <style>
    *, ::before, ::after {
      box-sizing: border-box;
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .icon-slot {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 9999px;
    }
    .active-indicator {
      position: absolute;
      left: 0;
      top: 6px;
      bottom: 6px;
      width: 5px;
      background-color: #3b82f6;
      border-top-right-radius: 9999px;
      border-bottom-right-radius: 9999px;
    }
  </style>

  <!-- Vị trí để trang con chèn thêm CSS riêng nếu cần -->
  {% block styles %}{% endblock %}
</head>

<body class="bg-[#f8fafc] text-slate-800 flex h-screen overflow-hidden">

  <!-- SIDEBAR (Server render sẵn, không bị trễ) -->
  <div class="shrink-0">
    {% include "admin/sidebar-admin.html" %}
  </div>

  <!-- KHU VỰC BÊN PHẢI -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

    <!-- HEADER -->
    <div class="w-full shrink-0">
      {% include "admin/header-admin.html" %}
    </div>

    <!-- MAIN CONTENT NẰM Ở ĐÂY -->
    <main class="flex-1 overflow-y-auto p-6 bg-[#f8fafc]">
      {% block content %}{% endblock %}
    </main>
  </div>

  <!-- Vị trí để nạp JavaScript riêng của từng trang -->
  {% block scripts %}{% endblock %}
</body>
</html>
