{% extends "base.html" %}

{% block title %}Dịch vụ sự kiện{% endblock title %}

{% block header %}
<div class="container header-page d-flex justify-content-center align-items-center">
  <h1 class="fw-bold text-white">Dịch vụ</h1>
</div>
{% endblock header %}

{% block content %}
<div class="container mb-4 mt-4">
  <div class="row align-items-center justify-content-between g-3">
    <div class="col-lg-6 col-md-6">
      <div class="search-container position-relative">
        <input type="text" class="form-control search-input ps-4" placeholder="Tìm kiếm dịch vụ..." />
        <i class="fas fa-search search-icon position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
      </div>
    </div>

    <div class="col-lg-3 col-md-3">
      <div class="dropdown">
        <button class="btn btn-drop dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Loại dịch vụ
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Trang trí sự kiện</a></li>
          <li><a class="dropdown-item" href="#">Âm thanh - Ánh sáng</a></li>
          <li><a class="dropdown-item" href="#">Nhân sự sự kiện</a></li>
        </ul>
      </div>
    </div>

    <div class="col-lg-3 col-md-3">
      <div class="dropdown">
        <button class="btn btn-drop dropdown-toggle w-100" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          Mức giá
        </button>
        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">Dưới 5 triệu</a></li>
          <li><a class="dropdown-item" href="#">5 - 15 triệu</a></li>
          <li><a class="dropdown-item" href="#">Trên 15 triệu</a></li>
        </ul>
      </div>
    </div>
  </div>
</div>
{% endblock content %}
